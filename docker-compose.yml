      NODE_ID: worker2
      NODE_PORT: "8002"
      STORAGE_DIR: /app/data/node2
      CONTROLLER_URL: http://controller:8000
      WORKER_URL: http://worker2:8002
    ports:
      - "8002:8002"
    volumes:
      - ./data/node2:/app/data/node2
    depends_on:
      - controller
    restart: unless-stopped

