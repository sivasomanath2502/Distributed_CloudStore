services:

  controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controller
    command: >
      uvicorn coordinator.main:app
      --host 0.0.0.0
      --port 8000
    environment:
      # Controller metadata lives in a mounted DIRECTORY. (Mounting a
      # single not-yet-existing file makes Docker create a directory in
      # its place and SQLite then cannot open it.)
      DB_PATH: /app/db/coordinator.db
    ports:
      - "8000:8000"
    volumes:
      - ./controller_data:/app/db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  worker1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker1
    command: >
      uvicorn storage_node.main:app
      --host 0.0.0.0
      --port 8001
    environment:
      NODE_ID: worker1
      NODE_PORT: "8001"
      STORAGE_DIR: /app/data/node1
      CONTROLLER_URL: http://controller:8000
      WORKER_URL: http://worker1:8001
    ports:
      - "8001:8001"
    volumes:
      - ./data/node1:/app/data/node1
    depends_on:
      controller:
        condition: service_healthy
    restart: unless-stopped

  worker2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker2
    command: >
      uvicorn storage_node.main:app
      --host 0.0.0.0
      --port 8002
    environment:
      NODE_ID: worker2
      NODE_PORT: "8002"
      STORAGE_DIR: /app/data/node2
      CONTROLLER_URL: http://controller:8000
      WORKER_URL: http://worker2:8002
    ports:
      - "8002:8002"
    volumes:
      - ./data/node2:/app/data/node2
    depends_on:
      controller:
        condition: service_healthy
    restart: unless-stopped

  worker3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker3
    command: >
      uvicorn storage_node.main:app
      --host 0.0.0.0
      --port 8003
    environment:
      NODE_ID: worker3
      NODE_PORT: "8003"
      STORAGE_DIR: /app/data/node3
      CONTROLLER_URL: http://controller:8000
      WORKER_URL: http://worker3:8003
    ports:
      - "8003:8003"
    volumes:
      - ./data/node3:/app/data/node3
    depends_on:
      controller:
        condition: service_healthy
    restart: unless-stopped

  worker4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker4
    command: >
      uvicorn storage_node.main:app
      --host 0.0.0.0
      --port 8004
    environment:
      NODE_ID: worker4
      NODE_PORT: "8004"
      STORAGE_DIR: /app/data/node4
      CONTROLLER_URL: http://controller:8000
      WORKER_URL: http://worker4:8004
    ports:
      - "8004:8004"
    volumes:
      - ./data/node4:/app/data/node4
    depends_on:
      controller:
        condition: service_healthy
    restart: unless-stopped

  # Optional command-line client (not started by `docker compose up`).
  #   docker compose run --rm client upload /files/photo.jpg
  client:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["client"]
    entrypoint: ["python", "-m", "client.cloudstore_cli"]
    environment:
      CLOUDSTORE_URL: http://controller:8000
    volumes:
      - ./client_files:/files
    depends_on:
      controller:
        condition: service_healthy
