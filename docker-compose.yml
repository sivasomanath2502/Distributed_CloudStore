services:

  controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controller
    command: >
      uvicorn coordinator.main:app
      --host 0.0.0.0
      --port 8000
    environment:
      DATABASE_URL: sqlite:///./db/coordinator.db
    ports:
      - "8000:8000"
    volumes:
      - ./controller_data:/app/db
    restart: unless-stopped

  worker1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker1
    command: >
      uvicorn storage_node.main:app
      --host 0.0.0.0
      --port 8001
    environment:
      NODE_ID: worker1
      NODE_PORT: "8001"
      STORAGE_DIR: /app/data/node1
      CONTROLLER_URL: http://controller:8000
      WORKER_URL: http://worker1:8001
    ports:
      - "8001:8001"
    volumes:
      - ./data/node1:/app/data/node1
    depends_on:
      - controller
    restart: unless-stopped

  worker2:
